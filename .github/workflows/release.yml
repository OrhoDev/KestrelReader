name: Release Browser Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync version from tag
        run: node scripts/sync-version.mjs "$VERSION"
        env:
          VERSION: ${{ github.ref_name }}

      - name: Typecheck
        run: npm run check

      - name: Build extension
        run: npm run build:extension

      - name: Zip extension
        run: |
          cd dist-extension
          zip -r "../kestrel-extension-${GITHUB_REF_NAME}.zip" .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: kestrel-extension-${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
